<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="128x128" href="/assets/icon.png" />
    <title>UniController for PS5</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/assets/messages.js"></script>
    <script src="/assets/ui.js"></script>
    <script defer src="/assets/navigation.js"></script>
    <script defer src="/assets/api.js"></script>
    <script defer src="/assets/app.js"></script>
    <script defer src="/assets/settings.js"></script>
    <script defer src="/assets/vendor/alpine-csp-3.14.9.min.js"></script>
  </head>
  <body x-data="shell">
    <noscript>UniController requires JavaScript / 请启用 JavaScript。</noscript>
    <div x-data="control" id="management" @uc-close-drawer.window="closeDrawer">
      <div :inert="drawerOpen">
        <header class="app-header">
          <a class="wordmark" href="/#controllers" aria-label="UniController"
            ><img src="/assets/brand.svg" width="238" height="44" alt="" /><span>FOR PS5</span></a
          ><span class="header-context" x-label="localPanel"></span>
        </header>
        <div class="app-shell">
          <nav class="navigation" aria-label="Navigation">
            <a href="/#controllers" data-page="controllers"
              ><span class="nav-index">01</span><span x-label="control"></span
            ></a>
            <a href="/controller" data-page="test"
              ><span class="nav-index">02</span><span x-label="test"></span
            ></a>
            <a href="/#logs" data-page="logs"
              ><span class="nav-index">03</span><span x-label="logsTitle"></span
            ></a>
            <a href="/#settings" data-page="settings"
              ><span class="nav-index">04</span><span x-label="settings"></span
            ></a>
            <div class="nav-footer">
              <span>UniController for PS5</span><span x-label="footer"></span>
            </div>
          </nav>
          <main>
            <section id="controllers-view" class="view" x-show="$store.ui.controllersPage" x-cloak>
              <div class="page-heading">
                <div>
                  <h1 tabindex="-1" x-label="control"></h1>
                  <p x-label="intro"></p>
                </div>
                <button
                  class="primary"
                  id="add-controller"
                  @click="openAdd"
                  x-label="addBluetooth"
                ></button>
              </div>
              <div class="service-strip">
                <div>Bluetooth <span id="bt-status" x-text="btStatus"></span></div>
                <div>USB <span id="usb-status" x-text="usbStatus"></span></div>
                <a href="/#settings" x-label="serviceSettings"></a>
              </div>
              <div class="section-heading" x-show="hasDevices">
                <h2 x-label="connectedControllers"></h2>
                <span class="muted" x-text="deviceCount"></span>
              </div>
              <div id="devices" class="device-list">
                <template x-for="device in devices" :key="device.key"
                  ><article class="device-row">
                    <svg class="device-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                      <rect x="4" y="13" width="40" height="28" rx="14" />
                      <circle cx="31" cy="22" r="2" />
                      <circle cx="35" cy="27" r="2" />
                      <path d="M12 27h10m-5-5v10M24 7v6" />
                    </svg>
                    <div class="device-content">
                      <div class="device-title">
                        <h3 x-text="device.name"></h3>
                        <span class="tag" x-text="device.transport"></span>
                      </div>
                      <div class="device-metadata">
                        <span x-label="connected"></span><span x-text="device.batteryText"></span
                        ><span x-text="device.inputStatus"></span>
                      </div>
                    </div>
                    <button
                      class="device-action"
                      :data-key="device.key"
                      @click="openDevice"
                      x-label="deviceSettings"
                    ></button></article
                ></template>
              </div>
              <div class="empty-state" x-show="noDevices">
                <svg class="device-icon" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                  <rect x="4" y="13" width="40" height="28" rx="14" />
                  <circle cx="31" cy="22" r="2" />
                  <circle cx="35" cy="27" r="2" />
                  <path d="M12 27h10m-5-5v10M24 7v6" />
                </svg>
                <h2 x-label="emptyTitle"></h2>
                <p x-label="emptyHint"></p>
                <button class="primary" @click="openAdd" x-label="addBluetooth"></button>
              </div>
              <section class="paired-group">
                <div class="section-heading">
                  <h2 x-label="pairedOffline"></h2>
                  <span class="muted" x-label="bluetoothDevices"></span>
                </div>
                <div id="paired-devices">
                  <template x-for="bond in offlineBonds" :key="bond.key"
                    ><article class="paired-row">
                      <div>
                        <h3 x-text="bond.address"></h3>
                        <p class="mono" x-text="bond.detail"></p>
                      </div>
                      <button
                        class="text-button"
                        :data-identity="bond.address"
                        @click="forget"
                        :disabled="btBusy"
                        x-label="forget"
                      ></button></article
                  ></template>
                </div>
                <p class="muted" x-show="noOfflineBonds" x-label="noOfflineBonds"></p>
              </section>
            </section>
            <section id="logs-view" class="view" x-show="$store.ui.logsPage" x-cloak>
              <div class="page-heading">
                <div>
                  <h1 tabindex="-1" x-label="logsTitle"></h1>
                  <p x-label="logsHint"></p>
                </div>
                <button id="export" @click="exportLogs" x-label="export"></button>
              </div>
              <div class="log-toolbar">
                <label
                  ><span class="sr-only" x-label="pageLevel"></span
                  ><select id="level" :value="level" @change="levelChanged">
                    <option>error</option>
                    <option>warn</option>
                    <option>info</option>
                    <option>debug</option>
                    <option>trace</option>
                  </select></label
                ><label class="check-label"
                  ><input
                    id="pause"
                    type="checkbox"
                    :checked="paused"
                    @change="pauseChanged" /><span x-label="pause"></span></label
                ><button id="refresh" @click="refresh" x-label="refresh"></button
                ><button id="copy" @click="copy" x-label="copy"></button
                ><a
                  class="button"
                  href="/api/v1/diagnostics"
                  target="_blank"
                  rel="noopener"
                  x-label="platformLogs"
                ></a>
              </div>
              <pre id="logs" class="terminal" x-text="logs"></pre>
              <details class="advanced">
                <summary x-label="advancedDiagnostics"></summary>
                <h2 x-label="systemInfo"></h2>
                <pre x-text="systemJSON"></pre>
                <h2 x-label="transportState"></h2>
                <pre x-text="transportJSON"></pre>
                <h2 x-label="testOutput"></h2>
                <pre x-text="sessionJSON"></pre>
              </details>
            </section>
            <section
              id="settings-view"
              class="view settings-view"
              x-show="$store.ui.settingsPage"
              x-cloak
            >
              <div class="page-heading">
                <div>
                  <h1 tabindex="-1" x-label="settings"></h1>
                  <p x-label="settingsIntro"></p>
                </div>
              </div>
              <h2 class="group-title" x-label="connectionServices"></h2>
              <div class="settings-group">
                <div class="setting">
                  <div>
                    <h3 x-label="bluetoothService"></h3>
                    <p x-label="bluetoothServiceHint"></p>
                    <p class="service-error" x-text="btStatus"></p>
                  </div>
                  <div class="service-actions">
                    <button
                      id="bt-start"
                      @click="startBT"
                      :disabled="btStartDisabled"
                      x-label="startBT"
                    ></button
                    ><button
                      id="bt-stop"
                      @click="stopBT"
                      :disabled="btStopDisabled"
                      x-label="stopBT"
                    ></button>
                  </div>
                </div>
                <div class="setting">
                  <div>
                    <h3 x-label="usbService"></h3>
                    <p x-label="usbHint"></p>
                    <p class="service-error" x-text="usbStatus"></p>
                  </div>
                  <div class="service-actions">
                    <button
                      id="usb-start"
                      @click="startUSB"
                      :disabled="usbStartDisabled"
                      x-label="startUSB"
                    ></button
                    ><button
                      id="usb-stop"
                      @click="stopUSB"
                      :disabled="usbStopDisabled"
                      x-label="stopUSB"
                    ></button>
                  </div>
                </div>
                <p class="group-hint" x-label="serviceGate"></p>
              </div>
              <div x-data="settings" id="settings-form">
                <h2 class="group-title" x-label="defaults"></h2>
                <p class="group-hint" x-label="settingsHint"></p>
                <fieldset :disabled="formDisabled">
                  <div class="settings-group">
                    <label class="setting"
                      ><span
                        ><strong x-label="rumble"></strong
                        ><span class="setting-hint" x-label="rumbleHint"></span></span
                      ><input
                        class="switch"
                        type="checkbox"
                        :checked="form.rumble"
                        data-form="rumble"
                        @change="formChanged"
                    /></label>
                    <label class="setting"
                      ><span
                        ><strong x-label="swap"></strong
                        ><span class="setting-hint" x-label="swapHint"></span></span
                      ><input
                        class="switch"
                        id="swap"
                        type="checkbox"
                        :checked="form.swap_ab"
                        data-form="swap_ab"
                        @change="formChanged"
                    /></label>
                    <details class="setting-mapping">
                      <summary x-label="mapping"></summary>
                      <p x-label="mappingHint"></p>
                      <div class="mapping">
                        <template x-for="field in commonFields" :key="field.id"
                          ><label
                            ><span x-text="field.name"></span
                            ><select x-field="field" :aria-label="field.name">
                              <template x-for="target in fields" :key="target.id"
                                ><option :value="target.id" x-text="target.name"></option
                              ></template></select></label
                        ></template>
                      </div>
                      <details>
                        <summary x-label="reserved"></summary>
                        <div class="mapping">
                          <template x-for="field in reservedFields" :key="field.id"
                            ><label
                              ><span x-text="field.name"></span
                              ><select x-field="field" :aria-label="field.name">
                                <template x-for="target in fields" :key="target.id"
                                  ><option :value="target.id" x-text="target.name"></option
                                ></template></select></label
                          ></template>
                        </div>
                      </details>
                      <button id="identity" @click="identity" x-label="identity"></button>
                    </details>
                  </div>
                  <h2 class="group-title" x-label="autoStart"></h2>
                  <div class="settings-group">
                    <label class="setting"
                      ><span
                        ><strong x-label="autoEnabled"></strong
                        ><span class="setting-hint" x-label="autoHint"></span></span
                      ><input
                        class="switch"
                        type="checkbox"
                        :checked="form.bluetooth_auto_start"
                        data-form="bluetooth_auto_start"
                        @change="formChanged" /></label
                    ><label class="setting"
                      ><span x-label="autoTrigger"></span
                      ><select
                        :value="form.bluetooth_auto_trigger"
                        data-form="bluetooth_auto_trigger"
                        @change="formChanged"
                      >
                        <option value="login" x-label="login"></option>
                        <option value="resume" x-label="resume"></option></select
                    ></label>
                  </div>
                  <h2 class="group-title" x-label="diagnostics"></h2>
                  <div class="settings-group">
                    <label class="setting"
                      ><span x-label="recording"></span
                      ><select
                        :value="form.recording_level"
                        data-form="recording_level"
                        @change="formChanged"
                      >
                        <template x-for="level in levels" :key="level"
                          ><option :value="level" x-text="level"></option
                        ></template></select></label
                    ><label class="setting"
                      ><span x-label="pageLevel"></span
                      ><select
                        :value="form.page_level"
                        data-form="page_level"
                        @change="formChanged"
                      >
                        <template x-for="level in levels" :key="level"
                          ><option :value="level" x-text="level"></option
                        ></template></select
                    ></label>
                  </div>
                </fieldset>
                <div class="save-bar">
                  <span
                    id="settings-status"
                    role="status"
                    :class="errorClass"
                    x-text="statusText"
                  ></span>
                  <div class="row">
                    <button id="load" @click="load" :disabled="loading" x-label="reload"></button
                    ><button
                      id="save"
                      class="primary"
                      @click="save"
                      :disabled="saveDisabled"
                      x-label="save"
                    ></button>
                  </div>
                </div>
                <h2 class="group-title" x-label="appearance"></h2>
                <div class="settings-group">
                  <label class="setting"
                    ><span x-label="language"></span
                    ><select
                      id="ui-language"
                      :value="$store.ui.lang"
                      data-preference="lang"
                      @change="preferenceChanged"
                    >
                      <option value="zh">简体中文</option>
                      <option value="en">English</option>
                    </select></label
                  ><label class="setting"
                    ><span x-label="theme"></span
                    ><select
                      id="ui-theme"
                      :value="$store.ui.theme"
                      data-preference="theme"
                      @change="preferenceChanged"
                    >
                      <option value="orange" x-label="orange"></option>
                      <option value="blue" x-label="blue"></option>
                      <option value="green" x-label="green"></option>
                      <option value="red" x-label="red"></option></select></label
                  ><label class="setting"
                    ><span x-label="size"></span
                    ><select
                      id="ui-size"
                      :value="$store.ui.size"
                      data-preference="size"
                      @change="preferenceChanged"
                    >
                      <option value="normal" x-label="normal"></option>
                      <option value="tv" x-label="tv"></option></select></label
                  ><label class="setting"
                    ><span x-label="navigation"></span
                    ><select
                      id="ui-navigation"
                      :value="$store.ui.navigation"
                      data-preference="navigation"
                      @change="preferenceChanged"
                    >
                      <option value="native" x-label="native"></option>
                      <option value="arrows" x-label="arrows"></option></select
                  ></label>
                  <p class="group-hint" x-label="appearanceHint"></p>
                  <p class="group-hint" x-label="navHint"></p>
                </div>
                <h2 class="group-title" x-label="launcher"></h2>
                <div class="settings-group">
                  <div class="setting">
                    <div>
                      <p id="launcher-status" x-text="launcherText"></p>
                      <p x-label="launcherHint"></p>
                    </div>
                    <div class="row">
                      <button
                        id="launcher-install"
                        @click="install"
                        :disabled="installDisabled"
                        x-label="install"
                      ></button
                      ><button
                        id="launcher-remove"
                        @click="remove"
                        :disabled="removeDisabled"
                        x-label="remove"
                      ></button>
                    </div>
                  </div>
                </div>
              </div>
              <div class="settings-group">
                <div class="setting">
                  <div>
                    <h3 x-label="stopApp"></h3>
                    <p x-label="stopHint"></p>
                  </div>
                  <button
                    id="stop"
                    class="danger"
                    @click="stopApp"
                    :disabled="stopping"
                    x-label="stopApp"
                  ></button>
                </div>
              </div>
            </section>
            <p
              id="status"
              class="status-line"
              :class="errorClass"
              role="status"
              x-text="statusText"
            ></p>
          </main>
        </div>
      </div>
      <div
        class="drawer-backdrop"
        x-show="drawerOpen"
        x-cloak
        @click="closeBackdrop"
        @keydown="drawerKeys"
      >
        <section
          class="drawer"
          role="dialog"
          aria-modal="true"
          :aria-label="drawerTitle"
          data-drawer
        >
          <header class="drawer-header">
            <h2 x-text="drawerTitle"></h2>
            <button data-close-drawer @click="closeDrawer" x-label="close"></button>
          </header>
          <div class="drawer-body" x-show="addingDevice">
            <p x-label="addHint"></p>
            <div class="search-panel">
              <h3 x-text="searchTitle"></h3>
              <p x-label="manualPairHint"></p>
              <button
                class="primary"
                id="bt-scan"
                @click="beginSearch"
                :disabled="searchDisabled"
                x-text="searchButton"
              ></button>
              <button
                id="bt-scan-stop"
                @click="stopSearch"
                :disabled="stopSearchDisabled"
                x-show="scanning"
                x-label="stopSearch"
              ></button>
              <p class="muted" x-show="searchNeedsReady" x-label="serviceGate"></p>
            </div>
            <p class="drawer-note" x-label="pairingCloseHint"></p>
            <section class="discovery-list" aria-live="polite">
              <h3 x-label="discoveredDevices"></h3>
              <p class="muted" x-show="noDiscovered" x-label="noDiscovered"></p>
              <template x-for="found in discovered" :key="found.key">
                <article class="discovered-device">
                  <div>
                    <strong x-text="found.name"></strong
                    ><span class="tag" x-text="found.transport"></span>
                  </div>
                  <p class="mono" x-text="found.address"></p>
                  <p>
                    <span x-text="found.stateText"></span
                    ><span class="signal" x-text="found.signal"></span>
                  </p>
                  <p class="error" x-show="found.reasonText" x-text="found.reasonText"></p>
                  <button
                    :data-discovery-id="found.id"
                    @click="pairDevice"
                    :disabled="found.disabled"
                    x-text="found.buttonText"
                  ></button>
                </article>
              </template>
            </section>
          </div>
          <div class="drawer-body" x-show="viewingDevice">
            <h3 x-text="detailDevice.name"></h3>
            <dl class="detail-grid">
              <dt x-label="transport"></dt>
              <dd x-text="detailDevice.transport"></dd>
              <dt x-label="identityLabel"></dt>
              <dd class="mono" x-text="detailDevice.identity"></dd>
              <dt x-label="protocol"></dt>
              <dd x-text="detailDevice.detail"></dd>
              <dt x-label="inputLabel"></dt>
              <dd x-text="detailDevice.input"></dd>
              <dt x-label="virtualOutput"></dt>
              <dd x-text="detailDevice.stateText"></dd>
              <dt x-label="batteryLabel"></dt>
              <dd x-text="detailDevice.batteryText"></dd>
            </dl>
            <p x-show="detailDevice.system_assignment" x-label="systemChoiceHint"></p>
            <p class="error" x-show="detailMissing" x-label="deviceGone"></p>
            <details class="advanced" x-show="detailDevice.assignable">
              <summary x-label="advancedAssignment"></summary>
              <p x-label="assignmentHint"></p>
              <label class="stacked"
                ><span x-label="user"></span
                ><select id="user" :value="selectedUser" @change="userChanged">
                  <option value="" x-label="noUsers"></option>
                  <template x-for="user in users" :key="user.id"
                    ><option :value="user.id" x-text="user.name"></option
                  ></template></select></label
              ><button
                id="assign-device"
                :data-source="detailDevice.source"
                :data-slot="detailDevice.slot"
                :data-identity="detailDevice.identity"
                @click="assignDevice"
                :disabled="detailAssignmentDisabled"
                x-label="assign"
              ></button>
              <p class="drawer-note" x-label="assignmentScope"></p>
            </details>
          </div>
          <p class="drawer-status" role="status" :class="errorClass" x-text="statusText"></p>
        </section>
      </div>
    </div>
  </body>
</html>
