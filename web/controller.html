<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" sizes="128x128" href="/assets/icon.png" />
    <title>UniController for PS5</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="/assets/messages.js"></script>
    <script src="/assets/ui.js"></script>
    <script defer src="/assets/navigation.js"></script>
    <link rel="stylesheet" href="/assets/touch.css" />
    <script defer src="/assets/vendor/alpine-csp-3.14.9.min.js"></script>
    <script defer src="/assets/touch.js"></script>
  </head>
  <body class="controller-page" x-data="shell">
    <noscript>UniController requires JavaScript / 请启用 JavaScript。</noscript>
    <header class="app-header">
      <a class="wordmark" href="/#controllers" aria-label="UniController"
        ><img src="/assets/brand.svg" width="238" height="44" alt="" /><span>FOR PS5</span></a
      ><span class="header-context" x-label="localPanel"></span>
    </header>
    <div class="app-shell">
      <nav class="navigation" aria-label="Navigation">
        <a href="/#controllers" data-page="controllers"
          ><span class="nav-index">01</span><span x-label="control"></span
        ></a>
        <a href="/controller" data-page="test"
          ><span class="nav-index">02</span><span x-label="test"></span
        ></a>
        <a href="/#logs" data-page="logs"
          ><span class="nav-index">03</span><span x-label="logsTitle"></span
        ></a>
        <a href="/#settings" data-page="settings"
          ><span class="nav-index">04</span><span x-label="settings"></span
        ></a>
        <div class="nav-footer">
          <span>UniController for PS5</span><span x-label="footer"></span>
        </div>
      </nav>
      <main>
        <section class="view touch-view">
          <div class="page-heading">
            <div>
              <h1 x-label="test"></h1>
              <p x-label="phoneHint"></p>
            </div>
          </div>
          <p class="group-hint" x-label="testIsolationHint"></p>
          <div class="touch-toolbar">
            <label class="stacked"
              ><span x-label="user"></span
              ><select id="user" aria-label="Signed-in user"></select></label
            ><button id="enable" class="primary" x-label="touchEnable"></button
            ><button id="disable" disabled x-label="disable"></button
            ><button id="release" class="danger" x-label="releaseAll"></button
            ><button id="focus" aria-pressed="false" x-label="focusMode"></button>
          </div>
          <p id="status" class="status-line" role="status">正在同步手柄状态…</p>
          <div id="controls" class="controller-stage" aria-label="PS5 controller">
            <div class="shoulders">
              <button
                class="padbutton"
                data-bit="256"
                aria-label="L2"
                aria-pressed="false"
                disabled
              >
                L2</button
              ><button
                class="padbutton"
                data-bit="1024"
                aria-label="L1"
                aria-pressed="false"
                disabled
              >
                L1</button
              ><button
                class="padbutton"
                data-bit="2048"
                aria-label="R1"
                aria-pressed="false"
                disabled
              >
                R1</button
              ><button
                class="padbutton"
                data-bit="512"
                aria-label="R2"
                aria-pressed="false"
                disabled
              >
                R2
              </button>
            </div>
            <div class="pad-layout">
              <div class="dpad" role="group" aria-label="D-pad">
                <button
                  class="padbutton key-up"
                  data-bit="16"
                  aria-label="D-pad up"
                  aria-pressed="false"
                  disabled
                >
                  ↑</button
                ><button
                  class="padbutton key-left"
                  data-bit="128"
                  aria-label="D-pad left"
                  aria-pressed="false"
                  disabled
                >
                  ←</button
                ><button
                  class="padbutton key-right"
                  data-bit="32"
                  aria-label="D-pad right"
                  aria-pressed="false"
                  disabled
                >
                  →</button
                ><button
                  class="padbutton key-down"
                  data-bit="64"
                  aria-label="D-pad down"
                  aria-pressed="false"
                  disabled
                >
                  ↓
                </button>
              </div>
              <div class="system-keys">
                <button
                  class="padbutton touchpad-key"
                  data-bit="1048576"
                  aria-label="Touchpad"
                  aria-pressed="false"
                  disabled
                >
                  Touchpad
                </button>
                <div class="row">
                  <button
                    class="padbutton"
                    data-bit="1"
                    aria-label="Create"
                    aria-pressed="false"
                    disabled
                  >
                    Create</button
                  ><button
                    class="padbutton"
                    data-bit="8"
                    aria-label="Options"
                    aria-pressed="false"
                    disabled
                  >
                    Options
                  </button>
                </div>
                <button
                  class="padbutton ps-key"
                  data-bit="65536"
                  aria-label="PS"
                  aria-pressed="false"
                  disabled
                >
                  PS
                </button>
              </div>
              <div class="face-buttons" role="group" aria-label="Face buttons">
                <button
                  class="padbutton key-up"
                  data-bit="4096"
                  aria-label="Triangle"
                  aria-pressed="false"
                  disabled
                >
                  △</button
                ><button
                  class="padbutton key-left"
                  data-bit="32768"
                  aria-label="Square"
                  aria-pressed="false"
                  disabled
                >
                  □</button
                ><button
                  class="padbutton key-right"
                  data-bit="8192"
                  aria-label="Circle"
                  aria-pressed="false"
                  disabled
                >
                  ○</button
                ><button
                  class="padbutton key-down"
                  data-bit="16384"
                  aria-label="Cross"
                  aria-pressed="false"
                  disabled
                >
                  ×
                </button>
              </div>
            </div>
            <div class="stick-row">
              <div class="stick-area">
                <div
                  id="left"
                  class="stick"
                  role="group"
                  aria-label="Left stick"
                  aria-disabled="true"
                >
                  <span></span>
                </div>
                <button
                  class="padbutton"
                  data-bit="2"
                  aria-label="L3"
                  aria-pressed="false"
                  disabled
                >
                  L3
                </button>
              </div>
              <div class="stick-area">
                <div
                  id="right"
                  class="stick"
                  role="group"
                  aria-label="Right stick"
                  aria-disabled="true"
                >
                  <span></span>
                </div>
                <button
                  class="padbutton"
                  data-bit="4"
                  aria-label="R3"
                  aria-pressed="false"
                  disabled
                >
                  R3
                </button>
              </div>
            </div>
          </div>
          <p class="touch-hint" x-label="touchHint"></p>
          <p class="touch-hint" x-label="touchLegend"></p>
          <details class="advanced">
            <summary x-label="advancedDiagnostics"></summary>
            <pre id="telemetry"></pre>
          </details>
        </section>
      </main>
    </div>
  </body>
</html>
