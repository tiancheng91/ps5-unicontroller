<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>UniController · 触控手柄</title>
    <link rel="stylesheet" href="/assets/shared/tokens.css" />
    <link rel="stylesheet" href="/assets/shared/components.css" />
    <link rel="stylesheet" href="/assets/controller/controller.css" />
  </head>
  <body class="controller-page">
    <header>
      <b>UNI / CONTROLLER</b><span class="tag">PS5 · VIRTUAL OUTPUT</span>
      <nav>
        <a href="/">控制面</a><a href="/controller" aria-current="page">触控手柄</a
        ><a href="/settings">设置</a>
      </nav>
    </header>
    <main>
      <h1>触控手柄 / TEST INPUT</h1>
      <div class="row">
        <select id="user" aria-label="已登录用户"></select
        ><button id="enable" class="primary">启用手柄</button
        ><button id="disable" class="danger" disabled>关闭输出</button
        ><button id="release" class="danger">紧急释放</button>
        <button id="focus" aria-pressed="false">专注操控</button>
      </div>
      <p id="status" class="status" role="status">默认关闭 · 正在读取已登录用户</p>
      <div id="controls" class="controller-stage" aria-label="PS5 控制器">
        <svg class="controller-shell" viewBox="0 0 720 460" aria-hidden="true" focusable="false">
          <g transform="translate(8 0) scale(2.2)">
            <path
              class="shell-edge"
              d="M70 34 Q160 26 250 34 Q294 40 304 84 L320 166 Q322 198 292 194 Q268 190 252 158 L236 136 H84 L68 158 Q52 190 28 194 Q-2 198 0 166 L16 84 Q26 40 70 34Z"
            />
            <path
              class="shell-inset"
              d="M95 35 Q160 29 225 35 L242 120 Q215 146 191 150 H129 Q105 146 78 120Z"
            />
            <path class="light-strip" d="M110 44 L116 94 M210 44 L204 94" />
            <path class="shell-seam" d="M73 42 Q49 65 45 100 M247 42 Q271 65 275 100" />
          </g>
        </svg>
        <button
          class="padbutton key-l2"
          data-bit="256"
          aria-label="L2"
          aria-pressed="false"
          disabled
        >
          L2
        </button>
        <button
          class="padbutton key-l1"
          data-bit="1024"
          aria-label="L1"
          aria-pressed="false"
          disabled
        >
          L1
        </button>
        <button
          class="padbutton key-create"
          data-bit="1"
          aria-label="Create 创建"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 3v7m-7-5 3 5m11-5-3 5M6 15h12v6H6Z" />
          </svg>
        </button>
        <button
          class="padbutton key-touchpad"
          data-bit="1048576"
          aria-label="Touchpad 触摸板"
          aria-pressed="false"
          disabled
        >
          <span>TOUCHPAD</span>
        </button>
        <button
          class="padbutton key-options"
          data-bit="8"
          aria-label="Options 选项"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M5 6h14M5 12h14M5 18h14" />
          </svg>
        </button>
        <button
          class="padbutton key-r1"
          data-bit="2048"
          aria-label="R1"
          aria-pressed="false"
          disabled
        >
          R1
        </button>
        <button
          class="padbutton key-r2"
          data-bit="512"
          aria-label="R2"
          aria-pressed="false"
          disabled
        >
          R2
        </button>
        <button
          class="padbutton key-up"
          data-bit="16"
          aria-label="方向上"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m6 15 6-7 6 7Z" />
          </svg>
        </button>
        <button
          class="padbutton key-left"
          data-bit="128"
          aria-label="方向左"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m15 6-7 6 7 6Z" />
          </svg>
        </button>
        <button
          class="padbutton key-down"
          data-bit="64"
          aria-label="方向下"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m6 9 6 7 6-7Z" />
          </svg>
        </button>
        <button
          class="padbutton key-right"
          data-bit="32"
          aria-label="方向右"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m9 6 7 6-7 6Z" />
          </svg>
        </button>
        <button
          class="padbutton key-triangle"
          data-bit="4096"
          aria-label="Triangle 三角"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m12 4 9 16H3Z" />
          </svg>
        </button>
        <button
          class="padbutton key-square"
          data-bit="32768"
          aria-label="Square 方块"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="4" y="4" width="16" height="16" />
          </svg>
        </button>
        <button
          class="padbutton key-cross"
          data-bit="16384"
          aria-label="Cross 叉"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="m5 5 14 14M19 5 5 19" />
          </svg>
        </button>
        <button
          class="padbutton key-circle"
          data-bit="8192"
          aria-label="Circle 圆"
          aria-pressed="false"
          disabled
        >
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="8" />
          </svg>
        </button>
        <button
          class="padbutton key-l3"
          data-bit="2"
          aria-label="L3 左摇杆按下"
          aria-pressed="false"
          disabled
        >
          L3
        </button>
        <button
          class="padbutton key-ps"
          data-bit="65536"
          aria-label="PS 主界面"
          aria-pressed="false"
          disabled
        >
          PS
        </button>
        <button
          class="padbutton key-r3"
          data-bit="4"
          aria-label="R3 右摇杆按下"
          aria-pressed="false"
          disabled
        >
          R3
        </button>
        <div
          class="stick"
          id="left"
          role="group"
          aria-label="左摇杆，触控拖动"
          aria-disabled="true"
        >
          <span></span>
        </div>
        <div
          class="stick"
          id="right"
          role="group"
          aria-label="右摇杆，触控拖动"
          aria-disabled="true"
        >
          <span></span>
        </div>
      </div>
      <p class="controller-legend">
        DUAL ANALOG / 18 CONTROLS <span>触摸拖动摇杆 · 聚焦按键后按住 Space / Enter</span>
      </p>
      <p>
        多点触控 · 按住发送 · 心跳 100ms · 服务端超时 500ms
        释放。切到后台会释放并暂停发送；回来后需重新启用输入。
      </p>
      <pre id="telemetry">DISABLED / neutral</pre>
    </main>
    <footer>UniController / 本地控制工作台 · 仅显式启用后输出输入</footer>
    <script src="/assets/controller/controller.js"></script>
  </body>
</html>
