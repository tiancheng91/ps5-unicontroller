  <circle cx="1374" cy="312" r="10" fill="#E5484D"/>
  <text x="1024" y="383" text-anchor="middle" fill="#A4A4A4" font-family="'Trebuchet MS', sans-serif" font-size="28" font-weight="400">Make Any Controller Work on PS5.</text>
