<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="640" viewBox="0 0 2048 640" role="img" aria-labelledby="title desc">
  <title id="title">UniController for PS5</title>
  <desc id="desc">A compact bold unicontroller wordmark with a red dot, a single-line tagline, and subtle red background waves.</desc>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E5484D" stop-opacity="0"/>
      <stop offset=".45" stop-color="#E5484D" stop-opacity=".17"/>
      <stop offset="1" stop-color="#E5484D" stop-opacity=".02"/>
    </linearGradient>
  </defs>
  <rect width="2048" height="640" fill="#111111"/>
  <g fill="none" stroke="url(#wave)">
